<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Place Your Order - Online Book Store</title>
    <style>
        body {
            background-color: #12372A;
            color: #D9D2C3;
            font-family: Arial, Helvetica, sans-serif;

        }


        h1,
        h2,
        h3 {
            color: #E8DCC4;
        }


        nav {
            background-color: #0B261D;
            color: #4F6B5E;
            text-align: center;
            border-radius: 8px;
            padding: 12px;
            margin: 15px 0;
        }

        .bookmark {
            color: #D9D2C3;
            text-decoration: none;
            font-weight: bold;
            padding: 6px 12px;
            border-radius: 5px;
        }

        .bookmark:hover {
            color: #0B261D;
            background-color: #D4AF37;
        }

        p,
        li,
        label,
        figcaption {
            color: #B8B8B8;
        }


        a {
            color: #D4AF37;
        }
        input,
        select,
        textarea,
        button {
            font-family: inherit;
        }
    </style>
</head>

<body>

    <h2>Place Your Order</h2>
    <nav>
        <a class="bookmark" href="index.html">Home</a> |
        <a class="bookmark" href="about.html">About Us</a> |
        <a class="bookmark" href="success.html">Success Stories</a> |
        <a class="bookmark" href="services.html">Services & Support</a> |
        <a class="bookmark" href="resources.html">Resources Hub</a> |
        <a class="bookmark" href="order.html">Order Now</a> |
        <a class="bookmark" href="contact.html">Contact Us</a>
    </nav>
    <hr>
    <form>

        <label>Customer Name:</label><br>
        <input type="text" name="customerName">
        <br><br>

        <label>Product:</label><br>
        <select name="product">
            <option>-- Select Product --</option>
            <option>Dr.Osama Alshareet book</option>
            <option>Java Book</option>
            <option>Python Book</option>
            <option>HTML and CSS Book</option>
            <option>Data Structures Book</option>
        </select>
        <br><br>

        <label>Quantity:</label><br>
        <input type="number" name="quantity">
        <br><br>

        <label>Delivery Option:</label><br>

        <input type="radio" name="delivery" value="Standard">
        Standard Delivery

        <input type="radio" name="delivery" value="Express">
        Express Delivery

        <br><br>

        <label>Payment Method:</label><br>

        <select name="payment">
            <option>-- Select Payment Method --</option>
            <option>Cash</option>
            <option>Credit Card</option>
            <option>PayPal</option>
        </select>

        <br><br>

        <input type="submit" value="Place Order">
        <input type="reset" value="Clear">

    </form>

</body>

</html>
